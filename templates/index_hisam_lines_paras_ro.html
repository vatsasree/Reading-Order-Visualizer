<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Layout Visualizer</title> -->
    <title>Hi-SAM RO Lines Words Visualizer</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        crossorigin="anonymous">

    <!-- styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zoomist@2/zoomist.css" />

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/zoomist@2/zoomist.umd.js"></script>

</head>

<style>
    /* make img center within image-container */
    #image-container {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #image-container>img {
        height: 80vh;
    }
</style>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row">
            <div class="col-6">
                <!-- <h1 class="mb-4">Layout Visualizer</h1> -->
                <h1 class="mb-4">Hi-SAM RO Lines Words Visualizer</h1>

                <!-- Dropdown to select an image -->
                <form method="get" action="{{ url_for('index') }}" class="mb-3">
                    <label for="image-selector" class="form-label">Select an image:</label>
                    <select id="image-selector" name="image_index" class="form-select">
                        {% for image in image_files %}
                        <option value="{{ image_files.index(image) }}" {% if image==current_image %}selected{% endif %}>
                            {{ image
                            }}
                        </option>
                        {% endfor %}
                    </select>
                    <input type="submit" value="View" class="btn btn-primary">
                </form>

                

                <div class="navigation-buttons mb-3">
                    {% if current_image %}
                        <a href="{{ url_for('prev_image', image_index=image_files.index(current_image)) }}"
                            class="btn btn-secondary">Previous</a>
                        <a href="{{ url_for('next_image', image_index=image_files.index(current_image)) }}"
                            class="btn btn-secondary">Next</a>
                    {% endif %}
                </div>

                <form>
                    <label>
                        <input {{ 'checked' if 'layout' not in request.url else '' }}
                        type="radio" name="view_option" value="paragraph"
                        {% if current_image %}
                            onclick="window.location.href='{{ url_for('index', image_index=image_files.index(current_image)) }}'">
                        {% else %}
                            disabled>
                        {% endif %}
                            <!--img src="/static/orig.png" alt="View Original" width="50px"-->
                        <span>View Original </span>
                    </label>

                    <label>
                        <input {{ 'checked' if 'lines' in request.url else '' }} type="radio" name="view_option"
                            value="paragraph"
                            {% if current_image %}
                            onclick="window.location.href='{{ url_for('show_image_lines', image_index=image_files.index(current_image)) }}'">
                        {% else %}
                            disabled>
                        {% endif %}
                        <!--img src="/static/para.png" alt="View Paragraph" width="50px"-->
                        <span>View Lines </span>

                    </label>

                    <label>
                        <input {{ 'checked' if 'paras' in request.url else '' }} type="radio" name="view_option"
                            value="paragraph"
                            {% if current_image %}
                            onclick="window.location.href='{{ url_for('show_image_paras', image_index=image_files.index(current_image)) }}'">
                        {% else %}
                            disabled>
                        {% endif %}
                        <!--img src="/static/para.png" alt="View Paragraph" width="50px"-->
                        <span>View Paragraphs </span>

                    </label>
                </form>

            


                
            </div>
            <div class="col-6"><!-- Display the selected image -->
                <!-- custom slider -->
                <div class="custom-zoomist-slider"></div>
                <!-- zoomist-container -->
                <div class="zoomist-container">
                    <!-- zoomist-wrapper is required -->
                    <div class="zoomist-wrapper">
                        <!-- zoomist-image is required -->
                        <div class="zoomist-image">
                            <!-- you can add anything you want to zoom here. -->
                            <!-- div id="image-container" -->
                            <div id="image-container" style="display: flex; justify-content: center; align-items: center; height: 100%;">
                                {% if error_message %}
                                    <p style="text-align: center;">{{ error_message }}</p>
                                {% else %}
                                    <img src="{{ url_for('static', filename=image_path) }}" alt="Current Image"
                                        class="img-fluid">
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>



        <script>
            const zoomist = new Zoomist('.zoomist-container',
                // Optional parameters
                {
                    maxScale: 4,
                    bounds: true,
                    // if you need slider
                    slider: true,
                    // if you need zoomer
                    zoomer: true,
                    on: {
                        update(zoomist) {
                            console.log(zoomist)
                        }
                    },
                }
            );
        </script>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
        ></script>
</body>

</html>
